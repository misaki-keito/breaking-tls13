services:
  server:
    build: .
    image: tlslab
    hostname: server
    cap_add: [NET_ADMIN]
    networks:
      lab:
        ipv4_address: 172.28.0.10
        aliases: [server.lab.test]
    volumes: ["./lab:/lab"]
  client:
    image: tlslab
    hostname: client
    cap_add: [NET_ADMIN]
    depends_on: [server]
    networks:
      lab:
        ipv4_address: 172.28.0.20
    volumes: ["./lab:/lab"]
networks:
  lab:
    ipam:
      config:
        - subnet: 172.28.0.0/24
